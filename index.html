function makeQ(def,tier){const n=tier==='age4'?3:4;const opts=shuffle([def.r,...shuffle(def.w.slice()).slice(0,n-1)]);return{q:def.q,opts,c:opts.indexOf(def.r),h:def.h};}

function genMath(tier,boost,only){boost=boost||0;let q,r,h,st=0;
 if(tier==='age4'){const a=ri(1,3+Math.min(boost,2)),b=ri(1,3);q=`${a} + ${b} = ?`;r=a+b;h='Hold up '+a+' fingers, then '+b+' more.';st=[a,b];}
 else{ /* Grade 2: within 100, gentle regrouping, skip counting, doubles, repeated addition, place value */
  const kinds=only==='arith'?['add','add','sub','sub','dbl']:['add','add','add','sub','sub','sub','skip','skip','dbl','rep','place'];const k=pick(kinds);
  if(k==='add'){let a,b;const reg=boost>0&&Math.random()<.3;
   if(reg){a=ri(12,59);if(a%10===0)a+=5;b=ri(10-a%10,9);}else{const ao=ri(0,6),bo=ri(1,9-ao);a=ri(1,6)*10+ao;b=pick([ri(0,2)*10+bo,bo]);if(b<1)b=bo;}
   if(only==='arith'&&boost<=0){a=ri(2,12);b=ri(2,9);}
   r=a+b;q=`${a} + ${b} = ?`;h=reg?'Add the ones first. If you reach 10, make a new ten.':'Add the tens, then add the ones.';}
  else if(k==='sub'){let a,b;const reg=boost>0&&Math.random()<.25;
   if(reg){a=ri(21,60);b=ri(a%10+1,9);}else{const ao=ri(2,9),bo=ri(0,ao);a=ri(1,5)*10+ao;b=pick([ri(0,2)*10+bo,bo]);if(b<1)b=1;if(b>=a)b=ao;}
   if(only==='arith'&&boost<=0){a=ri(8,20);b=ri(2,Math.min(9,a-1));}
   r=a-b;q=`${a} − ${b} = ?`;h='Count back from '+a+'.';}
  else if(k==='dbl'){const a=ri(2,10);r=a*2;q=only==='arith'?`${a} + ${a} = ?`:`Double ${a} is...`;h=a+' + '+a+' = ?';}
  else if(k==='skip'){st=pick([2,5,10]);const m=st===10?ri(0,5):st===5?ri(1,6):ri(1,8);const a=st*m;r=a+st*3;q=`What comes next? ${a}, ${a+st}, ${a+2*st}, __`;h='Count by '+(st===2?'twos':st===5?'fives':'tens')+'.';}
  else if(k==='rep'){const st2=pick([2,5,10]),n=ri(2,st2===2?5:4);r=st2*n;q=Array(n).fill(st2).join(' + ')+' = ?';h='Skip count by '+st2+', '+n+' times.';st=st2;}
  else{const t=ri(1,9),o=ri(0,9);const w=ri(0,1);r=w?o:t;q=w?`In the number ${t}${o}, how many ones?`:`In the number ${t}${o}, how many tens?`;h=w?'The last digit shows the ones.':'The first digit shows the tens.';
   const set=new Set([r]);for(const v of [w?t:o,r+1,r-1,r+2,10-r,t+o])if(v>=0&&v<=99&&set.size<4)set.add(v);const opts=shuffle([...set].map(String));return{q,opts,c:opts.indexOf(String(r)),h,ans:r};}}
 const set=new Set([r]);const want=tier==='age4'?3:4;let g=0;const cand=tier==='age4'?[-1,1,2,-2,3]:[-1,1,-2,2,10,-10,st||3,-(st||3),3];if(tier==='age4')st=st||0;
